name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 連続 push 時にデプロイが並走・逆順に完了しないようにする
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sol-momma.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      # 本番デプロイではキャッシュを使わない（cache poisoning 対策）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning] v4 は cache 未指定ならキャッシュしない
        with:
          node-version: "22"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # デプロイ後に本番の主要ページが実際に返ることを確認する
      - name: Smoke test
        run: |
          for path in / /about/ /Resume_SoMomma.pdf; do
            for _ in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://sol-momma.com${path}")
              [ "$code" = 200 ] && break
              sleep 6
            done
            echo "${path} -> ${code}"
            [ "$code" = 200 ] || exit 1
          done
